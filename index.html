<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:description" content="Free Figma plugin: edit images in PhotoCraft without leaving Figma. Save with ⌘S, your original is kept.">
<meta property="og:url" content="https://raphaelareas.github.io/photocraft-on-figma/">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #07070d; --texto: #f4f4f8; --texto-2: #a3a3b5; --texto-3: #6c6c80;
    --linha: rgba(255, 255, 255, .08); --vidro: rgba(255, 255, 255, .04);
    --grad: linear-gradient(100deg, #5b8cff 0%, #8f6bff 50%, #c77dff 100%);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--fundo); }
  body { margin: 0; min-height: 100vh; color: var(--texto); background: var(--fundo); overflow-x: hidden;
    font: 400 16px/1.6 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* Fundo: brilhos azul e roxo e uma grade bem sutil */
  .fundo { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .fundo::before { content: ''; position: absolute; inset: -20%;
    background:
      radial-gradient(40% 35% at 72% 42%, rgba(91, 108, 255, .22), transparent 70%),
      radial-gradient(30% 30% at 88% 70%, rgba(155, 92, 255, .18), transparent 70%),
      radial-gradient(35% 30% at 12% 10%, rgba(79, 124, 255, .10), transparent 70%); }
  .fundo::after { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(var(--linha) 1px, transparent 1px), linear-gradient(90deg, var(--linha) 1px, transparent 1px);
    background-size: 56px 56px; opacity: .35;
    -webkit-mask: radial-gradient(70% 60% at 60% 40%, #000, transparent 75%); mask: radial-gradient(70% 60% at 60% 40%, #000, transparent 75%); }

  .pagina { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  /* Menu */
  .nav { display: flex; align-items: center; justify-content: space-between; height: 84px; }
  .logo { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    transition: transform .35s var(--ease); box-shadow: 0 0 0 1px var(--linha); }
  .logo:hover { transform: rotate(-8deg) scale(1.04); }
  .logo span { width: 100%; height: 100%; background: #0b0b10;
    -webkit-mask: url(site/logo-ra.png) 50% / contain no-repeat; mask: url(site/logo-ra.png) 50% / contain no-repeat; }
  .nav-direita { display: flex; align-items: center; gap: 10px; }
  .idioma { appearance: none; -webkit-appearance: none; background: transparent; color: var(--texto-2); border: 1px solid var(--linha);
    border-radius: 999px; padding: 8px 14px; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer; }
  .idioma option { background: #14141c; color: var(--texto); }
  .rede { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--texto-2);
    border: 1px solid var(--linha); background: var(--vidro); transition: color .2s, border-color .2s, transform .2s; }
  .rede:hover { color: var(--texto); border-color: rgba(255, 255, 255, .22); transform: translateY(-1px); }
  .rede svg { width: 17px; height: 17px; }
  .btn-portfolio { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
    background: #fff; color: #0b0b10; font: 600 14px Inter, system-ui, sans-serif; transition: transform .2s, box-shadow .2s; }
  .btn-portfolio:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(143, 107, 255, .35); }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; align-items: center;
    min-height: calc(100vh - 84px - 72px); padding: 24px 0 40px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 22px; color: var(--texto-2);
    font: 600 12px/1 Inter, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px rgba(143, 107, 255, .18), 0 0 14px rgba(143, 107, 255, .8); }
  h1 { font: 600 clamp(40px, 5.2vw, 68px)/1.04 "Inter Tight", Inter, system-ui, sans-serif; letter-spacing: -.035em; margin: 0 0 22px; }
  h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--texto-2); font-size: 18px; max-width: 520px; margin: 0 0 34px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 44px; }
  .btn { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 999px;
    font: 600 15px Inter, system-ui, sans-serif; border: 0; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s, background .2s; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-figma { background: var(--grad); color: #fff; opacity: .5; cursor: not-allowed; }
  .selo { position: absolute; top: -10px; right: -8px; padding: 4px 9px; border-radius: 999px; background: #fff; color: #3b2a8c;
    font: 700 10.5px/1 Inter, system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  .btn-figma-caixa { position: relative; display: inline-flex; }
  .btn-github { background: var(--vidro); color: var(--texto); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
  .btn-github:hover { background: rgba(255, 255, 255, .08); transform: translateY(-1px); }

  .numeros { display: flex; flex-wrap: wrap; row-gap: 14px; }
  .numero { display: flex; align-items: center; gap: 12px; padding-right: 24px; margin-right: 24px; border-right: 1px solid var(--linha); }
  .numero:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .numero svg { width: 22px; height: 22px; color: var(--texto-2); flex: none; }
  .numero b { display: block; font: 600 16px/1.2 "Inter Tight", Inter, sans-serif; }
  .numero span { display: block; font-size: 12.5px; color: var(--texto-3); }

  /* Palco 3D */
  .palco { position: relative; height: 600px; display: grid; place-items: center; outline: none; }
  .orbita { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .06);
    transform: translate(-50%, -50%) rotateX(68deg); }
  .orbita.o1 { width: 560px; height: 560px; }
  .orbita.o2 { width: 400px; height: 400px; border-color: rgba(143, 107, 255, .14); }
  .ponto { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #a98bff; box-shadow: 0 0 12px #8f6bff;
    animation: piscar 3.2s ease-in-out infinite; }
  @keyframes piscar { 50% { opacity: .35; } }

  .cena { perspective: 1600px; width: 300px; height: 300px; }
  .pilha { position: relative; width: 300px; height: 300px; transform-style: preserve-3d;
    transform: rotateX(57deg) rotateZ(-45deg); transition: transform .9s var(--ease); }
  .placa { position: absolute; inset: 0; border-radius: 34px; transform-style: preserve-3d;
    transform: translateZ(calc(var(--i) * 26px)); transition: transform .9s var(--ease); }
  .placa .face { position: absolute; inset: 0; border-radius: 34px; display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(40, 42, 70, .96), rgba(18, 18, 32, .96));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .2); overflow: hidden; }
  .placa .face::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 60% at 30% 25%, rgba(255, 255, 255, .10), transparent 70%); }
  /* Espessura: cópias da placa logo abaixo, com um filete de cor no meio */
  .placa .borda { position: absolute; inset: 0; border-radius: 34px; background: #0c0c16;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
  .placa .borda:nth-of-type(1) { transform: translateZ(-6px); }
  .placa .borda:nth-of-type(2) { transform: translateZ(-12px); background: var(--cor); opacity: .9;
    box-shadow: 0 0 40px var(--cor), inset 0 0 0 1px rgba(255, 255, 255, .15); }
  .placa .borda:nth-of-type(3) { transform: translateZ(-18px); }
  .placa .num { position: absolute; right: 26px; bottom: 22px; font: 700 34px/1 "Inter Tight", sans-serif; color: rgba(255, 255, 255, .07); }
  .glifo { position: relative; width: 104px; height: 104px; border-radius: 28px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--cor), color-mix(in srgb, var(--cor) 45%, #12121f));
    box-shadow: 0 18px 40px -10px var(--cor), inset 0 1px 0 rgba(255, 255, 255, .35); transform: rotateZ(45deg); }
  .glifo svg { width: 50px; height: 50px; color: #fff; }
  .p1 { --i: 2; --cor: #5b8cff; }
  .p2 { --i: 1; --cor: #8f6bff; }
  .p3 { --i: 0; --cor: #c77dff; }

  .palco.aberto .placa { transform: translateZ(calc(var(--i) * 118px - 60px)); }

  /* Cartões que explicam cada camada */
  .cartao { position: absolute; width: 250px; padding: 14px 16px 15px; border-radius: 16px;
    background: rgba(18, 18, 30, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1), 0 20px 50px rgba(0, 0, 0, .45);
    opacity: 0; transform: translateY(10px); transition: opacity .5s var(--ease), transform .6s var(--ease); pointer-events: none; }
  .palco.aberto .cartao { opacity: 1; transform: none; }
  .palco.aberto .c2 { transition-delay: .08s; }
  .palco.aberto .c3 { transition-delay: .16s; }
  .cartao .topo { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .cartao .n { font: 700 11px/1 Inter, sans-serif; color: var(--texto-3); }
  .cartao b { font: 600 14.5px/1.3 "Inter Tight", Inter, sans-serif; }
  .cartao .chip { margin-left: auto; padding: 3px 8px; border-radius: 999px; font: 600 10.5px/1.4 Inter, sans-serif;
    color: #fff; background: color-mix(in srgb, var(--cor) 35%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cor) 60%, transparent); }
  .cartao p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--texto-2); }
  .cartao::after { content: ''; position: absolute; top: 50%; width: 56px; border-top: 1px dashed color-mix(in srgb, var(--cor) 70%, transparent); }
  .c1 { --cor: #5b8cff; right: 0; top: 70px; }
  .c2 { --cor: #8f6bff; left: 0; top: 240px; }
  .c3 { --cor: #c77dff; right: 0; top: 400px; }
  .c1::after, .c3::after { right: 100%; }
  .c2::after { left: 100%; }
  .dica { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    margin: 0; color: var(--texto-3); font-size: 12.5px; transition: opacity .3s; white-space: nowrap; }
  .dica svg { width: 14px; height: 14px; color: #a98bff; }
  .palco.aberto .dica { opacity: 0; }

  /* Rodapé */
  .rodape { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center;
    padding: 22px 0 28px; border-top: 1px solid var(--linha); color: var(--texto-3); font-size: 13px; }
  .rodape a { color: var(--texto-2); }
  .rodape a:hover { color: var(--texto); }
  .amor { display: flex; align-items: center; gap: 8px; }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; min-height: 0; padding-top: 16px; }
    .palco { height: auto; padding: 30px 0 20px; display: flex; flex-direction: column; align-items: center; }
    .cena { transform: scale(.82); margin: 10px 0 -10px; }
    .orbita, .ponto, .dica { display: none; }
    .cartao { position: relative; inset: auto; width: 100%; max-width: 460px; opacity: 1; transform: none; margin-top: 12px; }
    .cartao::after { display: none; }
    .palco.aberto .placa, .palco .placa { transform: translateZ(calc(var(--i) * 70px - 30px)); }
  }
  @media (max-width: 600px) {
    .pagina { padding: 0 16px; }
    .nav { height: 72px; }
    .btn-portfolio .texto-longo { display: none; }
    .idioma { padding: 7px 10px; }
    .rede { display: none; }
    .sub { font-size: 16.5px; }
    .acoes .btn, .btn-figma-caixa { width: 100%; justify-content: center; }
    .numero { padding-right: 14px; margin-right: 14px; }
    .cena { transform: scale(.68); margin: -20px 0 -40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="fundo" aria-hidden="true"></div>

<div class="pagina">
  <header class="nav">
    <a class="logo" href="https://raphaelareas.com/" aria-label="Raphael Arêas"><span></span></a>
    <div class="nav-direita">
      <select class="idioma" id="idioma" aria-label="Language">

      <a class="btn-portfolio" href="https://raphaelareas.com/" target="_blank" rel="noopener">
        <span><span data-t="portfolio"></span><span class="texto-longo" data-t="portfolio2"></span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>

  </header>

  <main class="hero">
    <section>
      <p class="eyebrow"><i></i><span data-t="eyebrow"></span></p>

      <p class="sub" data-t="sub"></p>
      <div class="acoes">
        <span class="btn-figma-caixa">
          <button class="btn btn-figma" type="button" disabled aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
            <span data-t="figma"></span>
          </button>
          <span class="selo" data-t="embreve"></span>
        </span>
        <a class="btn btn-github" href="https://github.com/raphaelareas/photocraft-on-figma/releases/latest/download/photocraft-on-figma-plugin.zip">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>

        <div class="numero">

        </div>
        <div class="numero">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg>
          <div><b id="versao">v1.0.0</b><span id="atualizado" data-t="gratis"></span></div>
        </div>
      </div>

    <section class="palco" id="palco" tabindex="0" aria-label="How it works">
      <div class="orbita o1" aria-hidden="true"></div>
      <div class="orbita o2" aria-hidden="true"></div>
      <span class="ponto" style="left: 14%; top: 30%" aria-hidden="true"></span>
      <span class="ponto" style="left: 84%; top: 24%; animation-delay: .8s" aria-hidden="true"></span>
      <span class="ponto" style="left: 90%; top: 62%; animation-delay: 1.6s" aria-hidden="true"></span>
      <span class="ponto" style="left: 22%; top: 76%; animation-delay: 2.2s" aria-hidden="true"></span>

      <div class="cena" aria-hidden="true">
        <div class="pilha">
          <div class="placa p3"><i class="borda"></i><i class="borda"></i><i class="borda"></i>

          <div class="placa p1"><i class="borda"></i><i class="borda"></i><i class="borda"></i>
            <div class="face"><span class="num">01</span><div class="glifo">

            </div></div></div>
        </div>
      </div>

      <div class="cartao c3"><div class="topo"><span class="n">03</span><b data-t="c3t"></b><span class="chip" id="atalho">⌘S</span></div><p data-t="c3"></p></div>
      <p class="dica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 4 7 16 2.5-6.5L20 11z"/></svg><span data-t="dica"></span></p>
    </section>
  </main>

      <span data-t="amor"></span> · <a href="https://raphaelareas.com/">@raphaelareas</a>

  </footer>
</div>

<script>
const TEXTOS = {
  en: {
    portfolio: 'View', portfolio2: ' my portfolio', eyebrow: 'Free Figma plugin · Open source',
    titulo1: 'Edit images in PhotoCraft', titulo2: 'without leaving Figma.',
    sub: 'Select an image, open it in a full editor with layers, masks and filters, and hit ⌘S. It updates in Figma, and your original stays safe in the same layer.',
    figma: 'Get it on Figma Community', embreve: 'Coming soon', github: 'Install from GitHub',
    estrelas: 'GitHub stars', downloads: 'Downloads', gratis: '100% free', atualizado: 'Updated {d}',
    c1t: 'Select an image', c1: 'Pick any layer with an image and run the plugin.',
    c2t: 'Edit in PhotoCraft', c2: 'The editor opens right inside Figma: layers, masks, filters, PSD.',
    c3t: 'Save, and it’s back', c3: 'The image updates in Figma. The original stays hidden in the same layer.',
    dica: 'Hover to see how it works', amor: 'Made with love and tokens',
    creditos: 'The editor is PhotoCraft, open source, by the ArtCraft team. This plugin is independent.', codigo: 'View the code',
    seguir: 'Follow on',
  },
  pt: {
    portfolio: 'Ver', portfolio2: ' meu portfólio', eyebrow: 'Plugin gratuito para Figma · Código aberto',
    titulo1: 'Edite imagens no PhotoCraft', titulo2: 'sem sair do Figma.',
    sub: 'Selecione uma imagem, abra num editor completo, com camadas, máscaras e filtros, e aperte ⌘S. Ela atualiza no Figma, e a original fica guardada na mesma camada.',
    figma: 'Instalar pela Comunidade do Figma', embreve: 'Em breve', github: 'Instalar pelo GitHub',
    estrelas: 'Estrelas no GitHub', downloads: 'Downloads', gratis: '100% gratuito', atualizado: 'Atualizado em {d}',
    c1t: 'Selecione uma imagem', c1: 'Escolha qualquer camada com imagem e rode o plugin.',
    c2t: 'Edite no PhotoCraft', c2: 'O editor abre dentro do próprio Figma: camadas, máscaras, filtros, PSD.',
    c3t: 'Salve, e volta pro Figma', c3: 'A imagem atualiza no Figma. A original fica oculta na mesma camada.',
    dica: 'Passe o mouse para ver como funciona', amor: 'Feito com amor e tokens',
    creditos: 'O editor é o PhotoCraft, de código aberto, do time ArtCraft. Este plugin é independente.', codigo: 'Ver o código',
    seguir: 'Seguir no',
  },
  es: {
    portfolio: 'Ver', portfolio2: ' mi portafolio', eyebrow: 'Plugin gratuito para Figma · Código abierto',
    titulo1: 'Edita imágenes en PhotoCraft', titulo2: 'sin salir de Figma.',
    sub: 'Selecciona una imagen, ábrela en un editor completo, con capas, máscaras y filtros, y pulsa ⌘S. Se actualiza en Figma, y la original queda guardada en la misma capa.',
    figma: 'Instalar desde la Comunidad de Figma', embreve: 'Próximamente', github: 'Instalar desde GitHub',
    estrelas: 'Estrellas en GitHub', downloads: 'Descargas', gratis: '100% gratis', atualizado: 'Actualizado el {d}',
    c1t: 'Selecciona una imagen', c1: 'Elige cualquier capa con imagen y ejecuta el plugin.',
    c2t: 'Edita en PhotoCraft', c2: 'El editor se abre dentro de Figma: capas, máscaras, filtros, PSD.',
    c3t: 'Guarda, y vuelve a Figma', c3: 'La imagen se actualiza en Figma. La original queda oculta en la misma capa.',
    dica: 'Pasa el mouse para ver cómo funciona', amor: 'Hecho con amor y tokens',
    creditos: 'El editor es PhotoCraft, de código abierto, del equipo ArtCraft. Este plugin es independiente.', codigo: 'Ver el código',
    seguir: 'Seguir en',
  },
};
const LOCAL = { en: 'en-US', pt: 'pt-BR', es: 'es-ES' };
const WINDOWS = /Win/i.test(navigator.platform || navigator.userAgent);
const teclas = (t) => (WINDOWS ? t.replace(/⌘S/g, 'Ctrl+S') : t);
let idioma = 'en', dadosGithub = null;

function aplicar(l) {
  idioma = TEXTOS[l] ? l : 'en';
  const t = TEXTOS[idioma];
  document.documentElement.lang = idioma === 'pt' ? 'pt-BR' : idioma;
  document.getElementById('idioma').value = idioma;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = teclas(t[el.dataset.t]);
  for (const a of document.querySelectorAll('.rede')) a.title = a.ariaLabel = t.seguir + ' ' + a.dataset.titulo;
  document.getElementById('atalho').textContent = WINDOWS ? 'Ctrl+S' : '⌘S';
  mostrarGithub();
}

// Números ao vivo do GitHub: estrelas, downloads das versões e data da última versão.
function mostrarGithub() {
  if (!dadosGithub) return;
  const n = (x) => new Intl.NumberFormat(LOCAL[idioma], { notation: 'compact' }).format(x);
  const { repo, versoes } = dadosGithub;
  if (repo) document.getElementById('estrelas').textContent = n(repo.stargazers_count);
  if (versoes && versoes.length) {
    const total = versoes.reduce((s, v) => s + v.assets.reduce((a, b) => a + b.download_count, 0), 0);
    document.getElementById('downloads').textContent = n(total);
    document.getElementById('versao').textContent = versoes[0].tag_name;
    const d = new Intl.DateTimeFormat(LOCAL[idioma], { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(versoes[0].published_at));
    document.getElementById('atualizado').textContent = TEXTOS[idioma].atualizado.replace('{d}', d);
  }
}
const API = 'https://api.github.com/repos/raphaelareas/photocraft-on-figma';
Promise.all([
  fetch(API).then((r) => (r.ok ? r.json() : null)).catch(() => null),
  fetch(API + '/releases').then((r) => (r.ok ? r.json() : null)).catch(() => null),
]).then(([repo, versoes]) => { dadosGithub = { repo, versoes }; mostrarGithub(); });

let salvo = null;
try { salvo = localStorage.getItem('idioma'); } catch (e) {}
const nav = (navigator.language || 'en').toLowerCase();
aplicar(salvo || (nav.startsWith('pt') ? 'pt' : nav.startsWith('es') ? 'es' : 'en'));
document.getElementById('idioma').onchange = (e) => {
  aplicar(e.target.value);
  try { localStorage.setItem('idioma', idioma); } catch (x) {}
};

// A pilha se abre com o mouse (ou com toque e teclado). No celular já fica aberta.
const palco = document.getElementById('palco');
const celular = matchMedia('(max-width: 980px)');
const abrir = (sim) => palco.classList.toggle('aberto', sim || celular.matches);
palco.addEventListener('mouseenter', () => abrir(true));
palco.addEventListener('mouseleave', () => abrir(false));
palco.addEventListener('focus', () => abrir(true));
palco.addEventListener('blur', () => abrir(false));
palco.addEventListener('click', () => abrir(!palco.classList.contains('aberto')));
abrir(false);
</script>
</body>
</html>
