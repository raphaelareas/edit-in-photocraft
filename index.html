<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar no PhotoCraft</title>
<meta name="description" content="Plugin gratuito para o Figma: edite imagens no PhotoCraft sem sair do Figma.">
<style>
  :root { --fundo: #f9f9f9; --card: #fff; --texto: #1d1d1f; --texto-2: #6e6e73; --azul: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #1e1e1e; --card: #2a2a2a; --texto: #f5f5f7; --texto-2: #a1a1a6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 520px; background: var(--card); border-radius: 16px; padding: 32px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06); }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
  p { color: var(--texto-2); margin: 0 0 16px; }
  a.botao { display: inline-block; background: var(--azul); color: #fff; text-decoration: none; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; margin: 4px 8px 4px 0; }
  a.link { color: var(--azul); }
  small { display: block; margin-top: 20px; color: var(--texto-2); }
  main { position: relative; }
  #idioma { position: absolute; top: 16px; right: 16px; font: inherit; font-size: 12px; color: var(--texto-2);
    background: transparent; border: 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <select id="idioma" aria-label="Idioma / Language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select>
  <h1 data-t="titulo"></h1>
  <p data-t="texto"></p>
  <a class="botao" href="https://github.com/raphaelareas/photocraft-on-figma" data-t="github"></a>
  <small><span data-t="criado"></span> <a class="link" href="https://www.linkedin.com/in/raphaelareas/">@raphaelareas</a>.
    <span data-t="creditos"></span></small>
</main>
<script>
const TEXTOS = {
  pt: { titulo: 'Editar no PhotoCraft', github: 'Ver no GitHub', criado: 'Criado por',
    texto: 'Plugin gratuito para o Figma. Selecione uma imagem, edite no PhotoCraft sem sair do Figma e, ao salvar com ⌘S, a imagem é trocada na hora. A original fica guardada na mesma camada.',
    creditos: 'O editor é o PhotoCraft, de código aberto, do time ArtCraft. Este plugin é independente.' },
  en: { titulo: 'Edit in PhotoCraft', github: 'View on GitHub', criado: 'Made by',
    texto: 'A free Figma plugin. Select an image, edit it in PhotoCraft without leaving Figma and, when you save with ⌘S, the image is replaced right away. Your original is kept in the same layer.',
    creditos: 'The editor is PhotoCraft, open source, by the ArtCraft team. This plugin is independent.' },
  es: { titulo: 'Editar en PhotoCraft', github: 'Ver en GitHub', criado: 'Creado por',
    texto: 'Plugin gratuito para Figma. Selecciona una imagen, edítala en PhotoCraft sin salir de Figma y, al guardar con ⌘S, la imagen se reemplaza al instante. La original se conserva en la misma capa.',
    creditos: 'El editor es PhotoCraft, de código abierto, del equipo ArtCraft. Este plugin es independiente.' },
};
const nav = (navigator.language || 'en').toLowerCase();
let salvo = null;
try { salvo = localStorage.getItem('idioma'); } catch (e) {}
function aplicar(l) {
  const t = TEXTOS[l] || TEXTOS.en;
  document.documentElement.lang = l;
  document.getElementById('idioma').value = l;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];
  document.title = t.titulo;
}
aplicar(salvo || (nav.startsWith('pt') ? 'pt' : nav.startsWith('es') ? 'es' : 'en'));
document.getElementById('idioma').onchange = (e) => {
  aplicar(e.target.value);
  try { localStorage.setItem('idioma', e.target.value); } catch (x) {}
};
</script>
</body>
</html>
